<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 6 — Tài liệu chưa có</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .empty-state-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .empty-card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 50px 36px;
        max-width: 560px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        animation: fadeInDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }

      .empty-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
      }

      .empty-icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        background: var(--primary-light);
        color: var(--primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.18);
        animation: pulseIcon 2.4s infinite ease-in-out;
      }

      .badge-empty {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--primary-dark);
        background: var(--primary-light);
        padding: 6px 16px;
        border-radius: 99px;
        margin-bottom: 16px;
      }

      .empty-card h2 {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 12px;
      }

      .empty-desc {
        color: var(--text-muted);
        font-size: 1rem;
        line-height: 1.65;
        margin-bottom: 32px;
      }

      .lesson-preview-info {
        background: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 32px;
        text-align: left;
        font-size: 0.92rem;
        color: var(--text-muted);
      }

      .lesson-preview-info strong {
        color: var(--text);
        display: block;
        margin-bottom: 4px;
      }

      .btn-actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #ffffff;
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.98rem;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px var(--primary-glow);
      }

      .btn-home:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      }

      @keyframes pulseIcon {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="empty-state-wrapper">
      <div class="empty-card">
        <div class="empty-icon">⏳</div>
        <span class="badge-empty">Bài 6 — Đang cập nhật</span>
        <h2>Tài liệu chưa có</h2>
          <a href="index.html" class="btn-home">🏠 Quay về trang chủ</a>
        </div>
      </div>
    </div>
  </body>
</html>
